# OhMyServer-Dashboard — Nginx + Let's Encrypt TLS template
# Copy to:     /etc/nginx/sites-available/<dashboard-domain>.conf
# Symlink to sites-enabled, then: certbot --nginx -d <dashboard-domain>
# Before activating: choose the subdomain (e.g. dashboard.*), point its DNS record at your server IP.
# Replace every <dashboard-domain> below with the real subdomain.

# --- HTTP: ACME-challenge + HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name <dashboard-domain>;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Reverse-proxy to Dashboard (Node :8787, session-bound) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <dashboard-domain>;

    ssl_certificate     /etc/letsencrypt/live/<dashboard-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<dashboard-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy-Header für korrekte Client-IP/Origin hinter Express
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (Live-Status) unterstützen
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
