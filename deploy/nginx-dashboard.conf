# OhMyServer-Dashboard — Nginx + Let's Encrypt TLS-Muster
# Kopieren nach: /etc/nginx/sites-available/dashboard.talbergh.art
# Symlink nach sites-enabled, dann: certbot --nginx -d dashboard.talbergh.art
# Vor Aktivierung: SUBDOMAIN festlegen (z.B. dashboard.talbergh.art), DNS zeigt auf 5.231.70.3

# --- HTTP: ACME-Challenge + Redirect auf HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.talbergh.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Reverse-Proxy auf Dashboard (Node :8787, session-gebunden) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.talbergh.art;

    ssl_certificate     /etc/letsencrypt/live/dashboard.talbergh.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.talbergh.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy-Header für korrekte Client-IP/Origin hinter Express
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (Live-Status) unterstützen
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
